name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} debug build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libsfml-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake sfml@2

      - name: Configure Debug build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build demo and tests
        run: cmake --build build --target physics physics_tests --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
